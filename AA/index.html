<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario Premium</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="light-mode">
    <div class="theme-switcher">
        <button id="themeToggle">
            <i class="fas fa-moon"></i>
            <span>Modo Oscuro</span>
        </button>
    </div>

    <div class="form-container">
        <div class="form-header">
            <div class="logo">
                <i class="fas fa-id-card-alt logo-icon"></i>
                <span>Formulario Premium</span>
            </div>
            <div class="header-decoration"></div>
        </div>

        <form id="registroForm">
            <div class="form-section">
                <div class="section-header">
                    <i class="fas fa-user-circle"></i>
                    <h2>Información Personal</h2>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="nombre"><i class="fas fa-signature"></i> Nombre completo</label>
                        <input type="text" id="nombre" name="nombre" required minlength="3" maxlength="50">
                        <div id="nombreError" class="error"></div>
                    </div>
                    
                    <div class="form-group">
                        <label for="email"><i class="fas fa-envelope"></i> Correo electrónico</label>
                        <input type="email" id="email" name="email" required>
                        <div id="emailError" class="error"></div>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="telefono"><i class="fas fa-phone-alt"></i> Teléfono</label>
                        <input type="tel" id="telefono" name="telefono" required pattern="[0-9]{9,15}">
                        <div id="telefonoError" class="error"></div>
                    </div>
                    
                    <div class="form-group">
                        <label for="fechaNacimiento"><i class="fas fa-birthday-cake"></i> Fecha nacimiento</label>
                        <input type="date" id="fechaNacimiento" name="fechaNacimiento" required>
                        <div id="fechaNacimientoError" class="error"></div>
                    </div>
                </div>
            </div>

            <div class="form-section">
                <div class="section-header">
                    <i class="fas fa-address-card"></i>
                    <h2>Detalles Adicionales</h2>
                </div>
                
                <div class="form-group">
                    <label><i class="fas fa-venus-mars"></i> Género</label>
                    <div class="radio-group">
                        <label class="radio-option">
                            <input type="radio" name="genero" value="masculino" required>
                            <span class="radio-custom"></span>
                            Masculino
                        </label>
                        <label class="radio-option">
                            <input type="radio" name="genero" value="femenino">
                            <span class="radio-custom"></span>
                            Femenino
                        </label>
                        <label class="radio-option">
                            <input type="radio" name="genero" value="otro">
                            <span class="radio-custom"></span>
                            Otro
                        </label>
                    </div>
                    <div id="generoError" class="error"></div>
                </div>
                
                <div class="form-group">
                    <label for="direccion"><i class="fas fa-map-marker-alt"></i> Dirección</label>
                    <textarea id="direccion" name="direccion" rows="4" required minlength="10" maxlength="200"></textarea>
                    <div id="direccionError" class="error"></div>
                </div>
            </div>

            <div class="form-section">
                <div class="terms-group">
                    <input type="checkbox" id="terminos" name="terminos" required>
                    <label for="terminos">
                        <span class="checkbox-custom"></span>
                        Acepto los <a href="#" class="gold-link">términos y condiciones</a> y 
                        <a href="#" class="gold-link">política de privacidad</a>
                    </label>
                </div>
                <div id="terminosError" class="error"></div>
            </div>

            <button type="submit" class="submit-button">
                <i class="fas fa-paper-plane"></i> Enviar Solicitud
            </button>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
